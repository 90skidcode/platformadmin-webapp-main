# §18. Assumes GitHub Actions + SonarCloud since neither was specified when
# this was set up -- swap for a self-hosted SonarQube server + different
# scanner action if that's not actually the case; this file doesn't change
# either way.
sonar.projectKey=enterprise-ui-system
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,src/schemas/forms/**,src/schemas/tables/**,src/messages/**,\
  src/services/**,src/hooks/use-auth.ts,src/hooks/use-debounce.ts,src/hooks/use-local-storage.ts,src/hooks/index.ts,\
  src/lib/utils/validation.ts,src/lib/utils/format.ts,src/lib/utils/api.ts,\
  src/schemas/auth-schema.ts,src/schemas/user-schema.ts,src/schemas/index.ts,\
  src/config/app.ts,src/config/api.ts,src/constants/**,src/types/**
# The exclusions on lines 2-4 are the pre-existing phone/OTP auth scaffold
# (see ARCHITECTURE.md's "A pre-existing, unrelated system in this repo") --
# unrelated to this plan, not touched by this build, and would otherwise
# drag the coverage/quality numbers down for code nobody wrote as part of
# this pass. NOT src/config/i18n.ts or src/config/index.ts -- both are
# genuinely used (src/i18n/request.ts imports the barrel).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
